<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shruti, I'm sorry 💛</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#12061f;color:#fff;font-family:'Poppins',system-ui,sans-serif}
body{background:radial-gradient(circle at 20% 20%,#4a1d6e 0,transparent 50%),radial-gradient(circle at 80% 80%,#7a2a4d 0,transparent 50%),#12061f;animation:bg 12s ease-in-out infinite alternate}
@keyframes bg{to{filter:hue-rotate(25deg)}}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s;overflow-y:auto}
.scene.on{opacity:1;pointer-events:auto}
h1{font-family:'Caveat',cursive,sans-serif;font-size:clamp(42px,9vw,84px);background:linear-gradient(90deg,#ffd1e8,#ffe9a8,#ffd1e8);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin-top:14px;font-weight:300;opacity:.85;max-width:440px;line-height:1.6}
.btn{margin-top:30px;padding:15px 38px;border:0;border-radius:50px;font:600 17px 'Poppins',sans-serif;color:#fff;background:linear-gradient(135deg,#ff6fa5,#ff9a6f);box-shadow:0 10px 35px rgba(255,111,165,.45);cursor:pointer;transition:transform .2s;user-select:none;-webkit-user-select:none;touch-action:none}
.btn:hover{transform:scale(1.06)}
.btn:active{transform:scale(.96)}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,111,165,.6)}100%{box-shadow:0 0 0 22px rgba(255,111,165,0)}}
.orbit{position:relative;width:150px;height:150px;margin-bottom:24px}
.orbit img{position:absolute;inset:0;width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:center 25%;border:4px solid #fff;box-shadow:0 0 40px rgba(255,120,180,.7);opacity:0;transition:opacity 1.2s}
.orbit img.on{opacity:1}
.meterWrap{width:min(88vw,460px);margin-top:34px}
.meter{position:relative;height:30px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.fill{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,#ff6fa5,#ffb36f,#ffe08a);box-shadow:0 0 25px rgba(255,150,120,.7)}
.heart{position:absolute;top:50%;left:0;font-size:34px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 10px #ff6fa5);animation:beat .7s infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.25)}}
.pct{font:600 46px 'Poppins';margin-top:20px}
.lab{height:28px;margin-top:4px;font-weight:300;letter-spacing:.5px}
#pops{position:fixed;inset:0;z-index:1;pointer-events:none}
.pol{position:absolute;background:#fff;padding:7px 7px 24px;border-radius:4px;box-shadow:0 12px 35px rgba(0,0,0,.5);width:clamp(90px,22vw,170px);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.pol img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;border-radius:2px}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}}
#letter{max-width:520px;min-height:200px}
#letter p{font-family:'Caveat',cursive,sans-serif;font-size:clamp(26px,5.6vw,36px);line-height:1.3;margin:10px 0;opacity:0;transform:translateY(14px);transition:all 1.1s}
#letter p.show{opacity:1;transform:none}
.q{font-family:'Caveat',cursive,sans-serif;font-size:clamp(38px,8vw,62px);margin-top:24px;opacity:0;transition:opacity 1s}
.q.show,.row.show{opacity:1}
.row{display:flex;gap:22px;align-items:center;justify-content:center;margin-top:22px;opacity:0;transition:opacity 1s;min-height:90px}
#no{background:rgba(255,255,255,.15);box-shadow:none;z-index:5}
#yes{transition:transform .25s}
.gal{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px;margin-bottom:26px}
.gal .pol{position:relative;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,float 4s ease-in-out infinite}
@keyframes float{50%{translate:0 -10px}}
.love{font-family:'Caveat',cursive,sans-serif;font-size:clamp(52px,13vw,120px);line-height:1.05;min-height:1.1em;background:linear-gradient(90deg,#ff7eb3,#ffd36f,#ff7eb3);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite;filter:drop-shadow(0 0 25px rgba(255,100,160,.6))}
@keyframes shine{to{background-position:200%}}
.cur::after{content:'|';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style></head><body>
<canvas id="c"></canvas><div id="pops"></div>
<section class="scene on" id="s1"><div class="orbit" id="orb"></div><h1 id="t1" class="cur"></h1><p class="sub" id="p1" style="opacity:0;transition:opacity 1.2s"></p><button class="btn pulse" id="go" style="opacity:0;transition:opacity 1.2s">Open ✨</button></section>
<section class="scene" id="s2"><h1>The Sorry Meter</h1><p class="sub">Press and hold the button until my sorry is full 💗</p>
<div class="meterWrap"><div class="meter"><div class="fill" id="fill"></div><div class="heart" id="hrt">💖</div></div></div>
<div class="pct" id="pct">0%</div><div class="lab" id="lab">Sorry-ish…</div>
<button class="btn" id="hold">Hold to fill 💞</button></section>
<section class="scene" id="s3"><div id="letter"></div><div class="q" id="q"></div><div class="row" id="row"><button class="btn" id="yes">Yes, I forgive you 💛</button><button class="btn" id="no">No</button></div></section>
<section class="scene" id="s4"><div class="gal" id="gal"></div><div class="love cur" id="love"></div><p class="sub" id="sig" style="opacity:0;transition:opacity 1.5s"></p></section>

const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cv=$('c'),cx=cv.getContext('2d');let W,H,ps=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const em=['💗','💖','✨','🌸','💛','💫'];
function spawn(x,y,burst){ps.push({x:x??Math.random()*W,y:y??H+20,vx:burst?(Math.random()-.5)*14:(Math.random()-.5)*.6,vy:burst?-Math.random()*14-4:-Math.random()*1.2-.4,s:burst?14+Math.random()*22:10+Math.random()*18,e:em[Math.random()*em.length|0],a:1,g:burst?.35:0,l:burst?1:0})}
(function loop(){cx.clearRect(0,0,W,H);if(Math.random()<.12)spawn();
ps=ps.filter(p=>{p.vy+=p.g;p.x+=p.vx+Math.sin(p.y/40)*.3;p.y+=p.vy;if(p.l)p.a-=.008;cx.globalAlpha=Math.max(p.a,0)*.75;cx.font=p.s+'px serif';cx.fillText(p.e,p.x,p.y);return p.y>-40&&p.y<H+60&&p.a>0});
requestAnimationFrame(loop)})();
const burst=n=>{for(let i=0;i<n;i++)spawn(W/2,H*.6,1)};
function show(id){document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id))}
async function type(el,t,d=70){el.textContent='';for(const ch of t){el.textContent+=ch;await sleep(d)}}
function pol(src){const d=document.createElement('div');d.className='pol';const i=new Image();i.src=src;d.appendChild(i);return d}
const orb=$('orb');CFG.photos.forEach((s,i)=>{const im=new Image();im.src=s;if(!i)im.className='on';orb.appendChild(im)});
let oi=0;setInterval(()=>{const a=orb.children;a[oi].classList.remove('on');oi=(oi+1)%a.length;a[oi].classList.add('on')},2200);
(async()=>{await sleep(600);await type($('t1'),CFG.intro,90);$('p1').textContent=CFG.introSub;$('p1').style.opacity=1;await sleep(900);$('go').style.opacity=1})();
$('go').onclick=()=>show('s2');
const slots=[[3,12],[72,10],[3,60],[72,58],[38,2]];let val=0,timer=null,popped=0;
function render(){const v=Math.min(val,100);$('fill').style.width=v+'%';$('hrt').style.left=v+'%';$('pct').textContent=Math.floor(v)+'%';
$('lab').textContent=CFG.labels[Math.min(Math.floor(v/(100/(CFG.labels.length-1))),CFG.labels.length-1)];
const need=Math.floor(v/20);while(popped<need&&popped<CFG.photos.length){const p=pol(CFG.photos[popped]);const s=slots[popped];p.style.left=s[0]+'%';p.style.top=s[1]+'%';p.style.rotate=(Math.random()*18-9)+'deg';$('pops').appendChild(p);burst(14);popped++}}
function start(e){e.preventDefault();if(timer||val>=100)return;timer=setInterval(()=>{val+=.9;render();const r=$('hold').getBoundingClientRect();for(let i=0;i<2;i++)spawn(r.left+Math.random()*r.width,r.top);if(val>=100){stop();done()}},40)}
function stop(){clearInterval(timer);timer=null}
const dec=setInterval(()=>{if(!timer&&val>0&&val<100){val=Math.max(0,val-.35);render()}},40);
$('hold').addEventListener('pointerdown',start);
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('hold').addEventListener(ev,stop));
async function done(){clearInterval(dec);val=100;render();$('hold').textContent='Full! 💖';burst(60);await sleep(2200);$('pops').innerHTML='';show('s3');letter()}
